[project]
name = "dao-ai-builder"
version = "0.1.0"
description = "Visual configuration builder for Databricks Agent-Orchestrated Applications (DAO-AI) with real-time YAML generation, deployment management, and interactive testing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "gunicorn>=21.0.0",
    # Pin floor is the published release the vendored JSON schema tracks (0.2.11).
    # A deployed Databricks App resolves dao-ai from PyPI, so the floor must be
    # resolvable. Field-level changes since 0.2.10 the builder emits/consumes:
    #   * InferenceEndpointModel: `ai_gateway` renamed to `use_ai_gateway` (dao-ai
    #     keeps a YAML alias; the builder migrates old configs on import and emits
    #     the new key). New `schema` (SchemaModel) qualifies a UC-securable model
    #     name (e.g. system.ai.claude-sonnet-4-5) and requires use_ai_gateway.
    #     use_ai_gateway now COMPOSES with use_responses_api (was rejected before).
    #   * GenieToolModel: `verbatim` renamed to `preserve_question` (NO YAML alias
    #     — the builder migrates on import). New `include_example_questions` (bool,
    #     default false, opt-in in every case).
    #   * AgentModel: new `handoff` (bool|null) — Genie-brain-under-supervisor
    #     deterministic handback; distinct from handoff_prompt / swarm handoffs.
    #   * ServicePrincipalModel: new optional `name` (display-name override) and
    #     `description` (documentation only).
    "dao-ai>=0.2.11",
    "databricks-sdk>=0.74.0",
    "mlflow[databricks]>=3.8.1",
    "python-dotenv>=1.2.1",
    "requests>=2.31.0",
    "jsonschema>=4.0.0",
]

[project.scripts]
dao-ai-builder = "app:main"
